<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>stttttttt</title>
  <link rel="icon" type="image/png" href="icon.png">
  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }
    body {
      max-width: 500px;
      margin: 20px auto;
      padding: 15px;
      background-color: #f4f4f9;
    }
    .card {
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    h2 {
      margin-top: 0;
      color: #333;
      text-align: center;
    }
    textarea {
      width: 100%;
      height: 120px;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      resize: vertical;
      font-size: 16px;
    }
    button {
      width: 100%;
      padding: 12px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }
    button:active {
      background-color: #0056b3;
    }
    .btn-danger {
      background-color: #dc3545;
    }
    .btn-danger:active {
      background-color: #bd2130;
    }
    .status {
      margin-top: 10px;
      font-size: 13px;
      color: #666;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>📱 App stttttttt Web Sync</h2>
    
    <label for="contentInput">Nội dung đồng bộ 2 chiều:</label>
    <textarea id="contentInput" placeholder="Nhập nội dung ở đây..."></textarea>
    
    <button onclick="sendDataToFirebase()">Lưu & Đồng bộ ngay</button>
    <button class="btn-danger" onclick="deleteDataFromFirebase()">Xóa dữ liệu đồng bộ</button>
    
    <div id="statusText" class="status">Trạng thái: Đang kết nối...</div>
  </div>

  <!-- 1. Nạp các thư viện Firebase SDK (CDN) -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-analytics-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

  <script>
    // 2. Cấu hình Firebase từ dự án twtd-847d4[span_0](start_span)[span_0](end_span)
    const firebaseConfig = {
      apiKey: "AIzaSyAiP7Z2sUuk7batZauIW8rA4udQ1_yMaLs",
      authDomain: "twtd-847d4.firebaseapp.com",
      databaseURL: "https://twtd-847d4-default-rtdb.firebaseio.com",
      projectId: "twtd-847d4",
      storageBucket: "twtd-847d4.firebasestorage.app",
      messagingSenderId: "568767871466",
      appId: "1:568767871466:web:5423e4ec3387375b595a93",
      measurementId: "G-P7GZNWF86L"
    };

    // 3. Khởi tạo Firebase & Realtime Database[span_1](start_span)[span_1](end_span)
    firebase.initializeApp(firebaseConfig);
    firebase.analytics();
    const database = firebase.database();

    const inputElement = document.getElementById('contentInput');
    const statusElement = document.getElementById('statusText');

    // ========================================================
    // 4. HÀM GỬI & XÓA DỮ LIỆU ĐỒNG BỘ
    // ========================================================
    function sendDataToFirebase() {
      const textValue = inputElement.value;
      statusElement.innerText = "⏳ Đang đồng bộ...";

      database.ref('shared_data/text').set(textValue)
        .then(() => {
          statusElement.innerText = "✅ Đã lưu và đồng bộ thành công!";
        })
        .catch((error) => {
          console.error("Lỗi:", error);
          statusElement.innerText = "❌ Lỗi đồng bộ: " + error.message;
        });
    }

    function deleteDataFromFirebase() {
      if (confirm("Bạn có chắc chắn muốn xóa sạch dữ liệu đồng bộ không?")) {
        statusElement.innerText = "⏳ Đang xóa...";
        database.ref('shared_data/text').remove()
          .then(() => {
            statusElement.innerText = "🗑️ Đã xóa dữ liệu đồng bộ!";
          })
          .catch((error) => {
            statusElement.innerText = "❌ Lỗi khi xóa: " + error.message;
          });
      }
    }

    // ========================================================
    // 5. TỰ ĐỘNG LẮNG NGHE DỮ LIỆU TỪ FIREBASE (SỬA & XÓA TỰ ĐỘNG)
    // ========================================================
    database.ref('shared_data/text').on('value', (snapshot) => {
      const data = snapshot.val();
      
      // Nếu dữ liệu bị xóa hoặc rỗng, tự xóa nội dung ở ô nhập
      inputElement.value = data ? data : "";
      
      if (data) {
        statusElement.innerText = "🔄 Đã cập nhật dữ liệu mới nhất!";
      } else {
        statusElement.innerText = "🟢 Dữ liệu trống / Đã xóa";
      }
    });

    // ========================================================
    // 6. TỰ ĐỘNG KIỂM TRA BẢN RELEASE MỚI TỪ GITHUB ĐỂ ĐỒNG BỘ CODE
    // ========================================================
    const GITHUB_USERNAME = "anhsung986";
    const REPO_NAME = "stttttttt";

    async function checkGitHubReleaseUpdate() {
      try {
        const res = await fetch(`https://api.github.com/repos/${GITHUB_USERNAME}/${REPO_NAME}/releases/latest`);
        if (!res.ok) return;

        const data = await res.json();
        const latestTag = data.tag_name;
        const currentTag = localStorage.getItem('app_version');

        if (latestTag && latestTag !== currentTag) {
          localStorage.setItem('app_version', latestTag);
          // Tự làm mới trang để nạp code mới nhất từ CDN/Web View
          window.location.reload(true);
        }
      } catch (e) {
        console.log("Kiểm tra bản cập nhật thất bại:", e);
      }
    }

    document.addEventListener("DOMContentLoaded", checkGitHubReleaseUpdate);
  </script>

</body>
</html>
